<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AToure Management & Consulting — Talent Database</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--surface2:#181818;--border:#222;--border2:#2a2a2a;--gold:#c9a84c;--gold2:#e8c97a;--text:#e8e2d9;--muted:#666;--muted2:#444;--ig:#e1306c;--tt:#69c9d0;--yt:#c4302b;--mega:#c9a84c;--macro:#7eb3c9;--mid:#9b7ec9;--micro:#7ec97e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"DM Mono",monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* HEADER */
header{border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:80px;position:sticky;top:0;background:rgba(10,10,10,0.96);backdrop-filter:blur(12px);z-index:100;}
.logo{display:flex;align-items:center;gap:16px;}
.logo-img{height:64px;width:64px;object-fit:contain;display:block;flex-shrink:0;background:black;}
.logo-divider{width:1px;height:36px;background:var(--border2);}
.logo-text{display:flex;flex-direction:column;gap:3px;}
.logo-name{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:400;letter-spacing:0.12em;color:var(--gold);line-height:1;}
.logo-sub{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:0.28em;color:var(--muted);text-transform:uppercase;line-height:1;}
.header-right{display:flex;gap:12px;align-items:center;}
.sync-pill{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:0.06em;color:var(--muted);padding:7px 13px;border:1px solid var(--border2);cursor:pointer;transition:border-color 0.2s;user-select:none;}
.sync-pill:hover{border-color:var(--gold);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted2);flex-shrink:0;transition:all 0.3s;}
.sync-dot.ok{background:#7ec97e;box-shadow:0 0 6px #7ec97e66;}
.sync-dot.busy{background:var(--gold);animation:blink 0.8s infinite;}
.sync-dot.err{background:var(--ig);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
.btn{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:0.1em;padding:8px 16px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;text-transform:uppercase;white-space:nowrap;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn.primary{border-color:var(--gold);color:var(--gold);}
.btn.primary:hover{background:var(--gold);color:var(--bg);}
.btn.danger{border-color:var(--yt);color:var(--yt);}
.btn.danger:hover{background:var(--yt);color:#fff;}

/* STATS */
.stats-bar{display:flex;border-bottom:1px solid var(--border);padding:0 40px;overflow-x:auto;}
.stat-item{padding:20px 32px;border-right:1px solid var(--border);flex-shrink:0;}
.stat-item:first-child{padding-left:0;}
.stat-label{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.stat-value{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:300;color:var(--gold);}
.stat-value.ig{color:var(--ig);}.stat-value.tt{color:var(--tt);}.stat-value.yt{color:var(--yt);}

/* TOOLBAR */
.toolbar{padding:20px 40px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:360px;}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:"DM Mono",monospace;font-size:12px;padding:10px 16px 10px 36px;outline:none;transition:border-color 0.2s;}
.search-wrap input:focus{border-color:var(--gold);}
.search-wrap input::placeholder{color:var(--muted2);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
.filter-select{background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:"DM Mono",monospace;font-size:11px;padding:10px 12px;outline:none;cursor:pointer;}
.view-toggle{display:flex;border:1px solid var(--border2);overflow:hidden;}
.view-btn{padding:9px 14px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;transition:all 0.15s;border-right:1px solid var(--border2);}
.view-btn:last-child{border-right:none;}
.view-btn.active{background:var(--surface2);color:var(--gold);}
.results-count{font-size:11px;color:var(--muted);letter-spacing:0.05em;margin-left:auto;}

/* GRID */
.grid-container{padding:32px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--border);}
.talent-card{background:var(--bg);padding:24px;cursor:pointer;transition:background 0.15s;position:relative;overflow:hidden;}
.talent-card::before{content:"";position:absolute;top:0;left:0;width:2px;height:0;background:var(--gold);transition:height 0.3s;}
.talent-card:hover::before{height:100%;}
.talent-card:hover{background:var(--surface);}
.card-header{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.avatar{width:64px;height:64px;min-width:64px;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--gold);overflow:hidden;flex-shrink:0;border-radius:2px;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.card-name{font-family:"Cormorant Garamond",serif;font-size:19px;color:var(--text);line-height:1.1;margin-bottom:5px;}
.card-meta{font-size:13px;color:var(--muted);line-height:1.5;}
.tier-badge{display:inline-block;font-size:9px;letter-spacing:0.15em;padding:2px 7px;border:1px solid;text-transform:uppercase;margin-bottom:12px;}
.tier-MEGA{color:var(--mega);border-color:var(--mega);}
.tier-MACRO{color:var(--macro);border-color:var(--macro);}
.tier-MID{color:var(--mid);border-color:var(--mid);}
.tier-MICRO{color:var(--micro);border-color:var(--micro);}
.card-stats{display:flex;flex-direction:column;gap:6px;}
.stat-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;}
.stat-platform{color:var(--muted);display:flex;align-items:center;gap:6px;min-width:80px;}
.plat-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.plat-dot.ig{background:var(--ig);}.plat-dot.tt{background:var(--tt);}.plat-dot.yt{background:var(--yt);}
.stat-num{font-family:"Cormorant Garamond",serif;font-size:16px;color:var(--text);}
.stat-bar-wrap{flex:1;margin:0 10px;height:1px;background:var(--border2);position:relative;}
.stat-bar-fill{height:100%;position:absolute;top:0;left:0;}
.stat-bar-fill.ig{background:var(--ig);}.stat-bar-fill.tt{background:var(--tt);}.stat-bar-fill.yt{background:var(--yt);}
.card-total{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;}
.total-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);}
.total-num{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--gold);}

/* LIST */
.list-container{padding:0 40px 40px;}
.list-table{width:100%;border-collapse:collapse;}
.list-table thead tr{border-bottom:1px solid var(--border2);}
.list-table th{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);padding:14px 12px;text-align:left;white-space:nowrap;}
.list-table tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.12s;}
.list-table tbody tr:hover{background:var(--surface);}
.list-table td{padding:14px 12px;font-size:12px;vertical-align:middle;}
.td-name{display:flex;align-items:center;gap:12px;font-family:"Cormorant Garamond",serif;font-size:16px;}
.avatar-sm{width:40px;height:40px;min-width:40px;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:16px;color:var(--gold);overflow:hidden;flex-shrink:0;}
.avatar-sm img{width:100%;height:100%;object-fit:cover;}
.td-role{color:var(--muted);font-size:11px;}.td-country{font-size:13px;}
.td-num{font-family:"Cormorant Garamond",serif;font-size:17px;}
.td-num.total{color:var(--gold);font-size:18px;}.td-zero{color:var(--muted2);font-size:11px;}

/* ===================== EDIT MODAL ===================== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:up 0.25s ease;}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:18px;}
.modal-avatar{width:80px;height:80px;min-width:80px;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:32px;color:var(--gold);overflow:hidden;flex-shrink:0;}
.modal-avatar img{width:100%;height:100%;object-fit:cover;}
.modal-title{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:300;color:var(--text);margin-bottom:4px;}
.modal-sub{font-size:11px;color:var(--muted);letter-spacing:0.1em;margin-bottom:8px;}
.modal-close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px;line-height:1;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:24px 32px;}
.field-group{margin-bottom:20px;}
.field-label{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block;}
.field-input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:"DM Mono",monospace;font-size:13px;padding:10px 14px;outline:none;transition:border-color 0.2s;}
.field-input:focus{border-color:var(--gold);}
.field-textarea{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);font-family:"DM Mono",monospace;font-size:12px;padding:10px 14px;outline:none;transition:border-color 0.2s;resize:vertical;min-height:80px;line-height:1.6;}
.field-textarea:focus{border-color:var(--gold);}
.field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;}
.modal-actions{padding:20px 32px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}

/* ===================== PROFILE CARD OVERLAY ===================== */
.profile-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.profile-overlay.open{display:flex;}
.profile-card{background:#0d0d0d;border:1px solid var(--border2);width:100%;max-width:680px;max-height:95vh;overflow-y:auto;position:relative;animation:up 0.3s ease;}

/* profile top bar */
.profile-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);}
.profile-topbar-logo{display:flex;align-items:center;gap:10px;}
.profile-topbar-logo img{height:36px;width:36px;object-fit:contain;background:black;}
.profile-topbar-name{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:0.14em;color:var(--gold);}
.profile-topbar-actions{display:flex;gap:8px;}

/* profile hero */
.profile-hero{display:flex;gap:0;border-bottom:1px solid var(--border);}
.profile-photo{width:220px;min-width:220px;height:260px;background:var(--surface2);overflow:hidden;flex-shrink:0;position:relative;}
.profile-photo img{width:100%;height:100%;object-fit:cover;}
.profile-photo-initials{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:72px;color:var(--gold);opacity:0.4;}
.profile-hero-info{flex:1;padding:28px 28px 24px;display:flex;flex-direction:column;justify-content:space-between;}
.profile-tier{margin-bottom:12px;}
.profile-name{font-family:"Cormorant Garamond",serif;font-size:36px;font-weight:300;color:var(--text);line-height:1.1;margin-bottom:8px;}
.profile-role{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
.profile-country{font-size:15px;color:var(--text);margin-bottom:20px;line-height:1.5;}
.profile-bio{font-size:12px;color:var(--muted);line-height:1.8;font-style:italic;border-left:2px solid var(--gold);padding-left:14px;margin-top:auto;}

/* stats section */
.profile-stats{padding:24px 28px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);}
.profile-stat{background:#0d0d0d;padding:20px 16px;text-align:center;}
.profile-stat-icon{font-size:11px;letter-spacing:0.1em;margin-bottom:6px;text-transform:uppercase;}
.profile-stat-num{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:300;line-height:1;}
.profile-stat-label{font-size:9px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-top:4px;}
.profile-stat.ig .profile-stat-icon{color:var(--ig);}
.profile-stat.ig .profile-stat-num{color:var(--ig);}
.profile-stat.tt .profile-stat-icon{color:var(--tt);}
.profile-stat.tt .profile-stat-num{color:var(--tt);}
.profile-stat.yt .profile-stat-icon{color:var(--yt);}
.profile-stat.yt .profile-stat-num{color:var(--yt);}

/* social links */
.profile-socials{padding:20px 28px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.social-link{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--border2);text-decoration:none;transition:border-color 0.2s;cursor:pointer;}
.social-link:hover{border-color:var(--gold);}
.social-link-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.social-link-dot.ig{background:var(--ig);}
.social-link-dot.tt{background:var(--tt);}
.social-link-dot.yt{background:var(--yt);}
.social-link-platform{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);width:80px;flex-shrink:0;}
.social-link-handle{font-family:"Cormorant Garamond",serif;font-size:17px;color:var(--text);flex:1;}
.social-link-followers{font-size:11px;color:var(--muted);margin-left:auto;}
.social-link-arrow{color:var(--muted);font-size:14px;margin-left:10px;transition:color 0.2s;}
.social-link:hover .social-link-arrow{color:var(--gold);}

/* total reach */
.profile-reach{padding:20px 28px;display:flex;align-items:center;justify-content:space-between;}
.profile-reach-label{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);}
.profile-reach-num{font-family:"Cormorant Garamond",serif;font-size:40px;font-weight:300;color:var(--gold);}

/* print styles */
@media print{
  body{background:white;color:black;}
  header,.toolbar,.stats-bar,#mainContent,.profile-topbar-actions,.profile-overlay ~ *{display:none!important;}
  .profile-overlay{position:static!important;background:white!important;padding:0!important;display:block!important;}
  .profile-card{max-height:none!important;border:none!important;box-shadow:none!important;background:white!important;max-width:100%!important;}
  .profile-hero{background:white;}
  .profile-photo{border:1px solid #ddd;}
  .profile-name,.profile-role,.profile-country,.profile-bio,.profile-reach-label{color:#333!important;}
  .profile-stat{background:white!important;}
  .profile-stat-label{color:#666!important;}
  .profile-stats{background:#eee!important;}
  .profile-socials,.social-link{border-color:#ddd!important;}
  .social-link-platform,.social-link-followers,.social-link-arrow{color:#999!important;}
  .social-link-handle{color:#222!important;}
  .profile-topbar{border-color:#ddd!important;}
  .tier-badge{border-color:currentColor!important;}
  .profile-reach{border-top:1px solid #eee;}
}

.toast{position:fixed;bottom:30px;right:30px;background:var(--surface);border:1px solid var(--gold);color:var(--gold);font-size:12px;letter-spacing:0.08em;padding:12px 20px;z-index:400;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.empty-state{text-align:center;padding:80px 40px;color:var(--muted);font-size:12px;letter-spacing:0.1em;}

@media(max-width:768px){
  header,.stats-bar,.toolbar,.grid-container,.list-container{padding-left:20px;padding-right:20px;}
  .grid-container{grid-template-columns:1fr 1fr;}
  .field-row{grid-template-columns:1fr;}
  .profile-hero{flex-direction:column;}
  .profile-photo{width:100%;min-width:unset;height:200px;}
  .profile-stats{grid-template-columns:1fr 1fr 1fr;}
}
@media(max-width:480px){.grid-container{grid-template-columns:1fr;}}
</style>
</head>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModalDirect()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-avatar" id="modalAvatar"></div>
      <div style="flex:1">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-sub" id="modalSub"></div>
        <div id="modalTier"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">Full Name</label>
        <input class="field-input" id="editName" type="text">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <div class="field-group" style="margin-bottom:0">
          <label class="field-label">Role</label>
          <input class="field-input" id="editRole" type="text">
        </div>
        <div class="field-group" style="margin-bottom:0">
          <label class="field-label">Country</label>
          <input class="field-input" id="editCountry" type="text">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Instagram Handle</label>
        <input class="field-input" id="editInstagram" type="text" placeholder="@handle">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <div class="field-group" style="margin-bottom:0">
          <label class="field-label">TikTok Handle</label>
          <input class="field-input" id="editTiktok" type="text" placeholder="@handle">
        </div>
        <div class="field-group" style="margin-bottom:0">
          <label class="field-label">YouTube Channel</label>
          <input class="field-input" id="editYoutube" type="text" placeholder="@channel or URL">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Photo URL</label>
        <input class="field-input" id="editPhotoUrl" type="text" placeholder="https://..." oninput="previewPhoto()">
      </div>
      <div class="field-group">
        <label class="field-label">Bio</label>
        <textarea class="field-textarea" id="editBio" placeholder="Short description of this talent..."></textarea>
      </div>
      <div class="field-label" style="margin-bottom:10px">Followers</div>
      <div class="field-row">
        <div>
          <label class="field-label" style="color:var(--ig)">● Instagram</label>
          <input class="field-input" id="editIg" type="number" min="0">
        </div>
        <div>
          <label class="field-label" style="color:var(--tt)">● TikTok</label>
          <input class="field-input" id="editTt" type="number" min="0">
        </div>
        <div>

let db=[], view='grid', editIdx=-1;

function loadLocal(){try{const s=localStorage.getItem(S_DB);if(s){db=JSON.parse(s);return true;}}catch(e){}db=SEED.map((d,i)=>({...d,id:d.id||i,notes:d.notes||'',bio:d.bio||'',tiktok_handle:d.tiktok_handle||'',youtube_handle:d.youtube_handle||''}));saveLocal();return false;}
function saveLocal(){try{localStorage.setItem(S_DB,JSON.stringify(db));}catch(e){}}

async function sheetsPost(body){const r=await fetch(SHEETS_URL,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain'}});return r.json();}
async function pullFromSheets(){
  setSyncUI('busy','Fetching from Sheets…');
  try{
    const r=await sheetsPost({action:'getAll'});
    if(r.ok&&Array.isArray(r.data)&&r.data.length>0){
      db=r.data.map(row=>({...row,instagram_followers:parseInt(row.instagram_followers)||0,tiktok_followers:parseInt(row.tiktok_followers)||0,youtube_followers:parseInt(row.youtube_followers)||0,bio:row.bio||'',tiktok_handle:row.tiktok_handle||'',youtube_handle:row.youtube_handle||''}));
      saveLocal();renderStats();renderAll();
      setSyncUI('ok','Synced · '+new Date().toLocaleTimeString());
      showToast('✓ Loaded '+db.length+' records from Google Sheets');
    } else if(r.ok&&r.data&&r.data.length===0){pushAllToSheets();}
    else{throw new Error(r.error||'Empty');}
  }catch(e){setSyncUI('err','Offline — using local data');}
}
async function pushAllToSheets(){setSyncUI('busy','Uploading…');try{const r=await sheetsPost({action:'bulkInit',records:db});if(r.ok){setSyncUI('ok','Synced · '+db.length+' records');showToast('✓ '+db.length+' records uploaded');}else throw new Error(r.error);}catch(e){setSyncUI('err','Upload failed');}}
async function pushRecord(record){try{const r=await sheetsPost({action:'save',record});if(r.ok)setSyncUI('ok','Synced · '+new Date().toLocaleTimeString());}catch(e){setSyncUI('err','Sync failed — saved locally');}}
async function deleteRecord(id){try{await sheetsPost({action:'delete',id});setSyncUI('ok','Synced · '+new Date().toLocaleTimeString());}catch(e){setSyncUI('err','Delete sync failed');}}
function setSyncUI(state,label){document.getElementById('syncDot').className='sync-dot '+state;document.getElementById('syncLabel').textContent=label;}

function tier(t){return t>=10000000?'MEGA':t>=1000000?'MACRO':t>=100000?'MID':'MICRO';}
function fmt(n){if(!n)return null;if(n>=1000000)return(n/1000000).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return n.toLocaleString();}
function total(t){return(t.instagram_followers||0)+(t.tiktok_followers||0)+(t.youtube_followers||0);}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function avHtml(t,sz){const c=sz==='sm'?'avatar-sm':'avatar';if(t.photo_url)return`<div class="${c}"><img src="${t.photo_url}" onerror="this.parentNode.innerHTML='${initials(t.name)}'"></div>`;return`<div class="${c}">${initials(t.name)}</div>`;}

// SOCIAL LINK HELPERS
function igUrl(h){if(!h)return null;const c=h.replace('@','').trim();return c?'https://instagram.com/'+c:null;}
function ttUrl(h){if(!h)return null;const c=h.replace('@','').trim();return c?'https://tiktok.com/@'+c:null;}
function ytUrl(h){if(!h)return null;if(h.startsWith('http'))return h;const c=h.replace('@','').trim();return c?'https://youtube.com/@'+c:null;}

      <span class="social-link-dot yt"></span>
      <span class="social-link-platform">YouTube</span>
      <span class="social-link-handle">${ytH.replace('@','@')}</span>
      <span class="social-link-followers">${fmt(t.youtube_followers)||'—'} subscribers</span>
      <span class="social-link-arrow">↗</span>
    </a>` : (t.youtube_followers ? `<div class="social-link" style="cursor:default">
      <span class="social-link-dot yt"></span>
      <span class="social-link-platform">YouTube</span>
      <span class="social-link-handle" style="color:var(--muted);font-size:13px">Add channel to enable link</span>
      <span class="social-link-followers">${fmt(t.youtube_followers)} subscribers</span>
    </div>` : '')
  ].filter(Boolean).join('');

  document.getElementById('profileCard').innerHTML = `
    <div class="profile-topbar">
      <div class="profile-topbar-logo">
        <img src="${LOGO_SRC}" alt="AToure">
        <span class="profile-topbar-name">AToure Management &amp; Consulting</span>
      </div>
      <div class="profile-topbar-actions">
        <button class="btn" onclick="openEditFromProfile(${idx})">✎ Edit</button>
        <button class="btn primary" onclick="window.print()">⎙ Print / PDF</button>
        <button class="btn" onclick="closeProfile()" style="padding:8px 10px">×</button>
      </div>
    </div>
    <div class="profile-hero">
      <div class="profile-photo">${photoHTML}</div>
      <div class="profile-hero-info">
        <div>
          <div class="profile-tier"><span class="tier-badge tier-${ti}">${ti} Talent</span></div>
          <div class="profile-name">${t.name}</div>
          <div class="profile-role">${t.role||''}</div>
          <div class="profile-country">${fmtCountry(t.country||'')}</div>
        </div>
        ${t.bio ? `<div class="profile-bio">${t.bio}</div>` : ''}
      </div>
    </div>
    <div class="profile-stats">
      <div class="profile-stat ig">
        <div class="profile-stat-icon">● Instagram</div>
        <div class="profile-stat-num">${fmt(t.instagram_followers)||'—'}</div>
        <div class="profile-stat-label">Followers</div>
      </div>
      <div class="profile-stat tt">
        <div class="profile-stat-icon">● TikTok</div>
        <div class="profile-stat-num">${fmt(t.tiktok_followers)||'—'}</div>
        <div class="profile-stat-label">Followers</div>
      </div>
      <div class="profile-stat yt">
        <div class="profile-stat-icon">● YouTube</div>
        <div class="profile-stat-num">${fmt(t.youtube_followers)||'—'}</div>
        <div class="profile-stat-label">Subscribers</div>
      </div>
    </div>
    <div class="profile-socials">${socialLinks}</div>
    <div class="profile-reach">
      <div class="profile-reach-label">Total Reach</div>
      <div class="profile-reach-num">${fmt(T)||'—'}</div>
    </div>
  `;
  document.getElementById('profileOverlay').classList.add('open');
}

function closeProfile(){document.getElementById('profileOverlay').classList.remove('open');}
function openEditFromProfile(idx){closeProfile();openEdit(idx);}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeProfile();closeModalDirect();}});

// ===================== FILTER / RENDER =====================
function filtered(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const r=document.getElementById('roleFilter').value;
  const ti=document.getElementById('tierFilter').value;
  const s=document.getElementById('sortBy').value;
  let l=db.filter(t=>{
    if(q&&!(t.name||'').toLowerCase().includes(q)&&!(t.country||'').toLowerCase().includes(q)&&!(t.instagram||'').toLowerCase().includes(q))return false;
    if(r&&!(t.role||'').includes(r))return false;
    if(ti&&tier(total(t))!==ti)return false;
    return true;
  });
  l.sort((a,b)=>{
    if(s==='name')return(a.name||'').localeCompare(b.name||'');
    if(s==='instagram')return(b.instagram_followers||0)-(a.instagram_followers||0);
    if(s==='tiktok')return(b.tiktok_followers||0)-(a.tiktok_followers||0);
    if(s==='youtube')return(b.youtube_followers||0)-(a.youtube_followers||0);
    return total(b)-total(a);
  });
  return l;
}

function renderStats(){
  const ig=db.reduce((s,t)=>s+(t.instagram_followers||0),0);
  const tt=db.reduce((s,t)=>s+(t.tiktok_followers||0),0);
  const yt=db.reduce((s,t)=>s+(t.youtube_followers||0),0);
  document.getElementById('statsBar').innerHTML=`
    <div class="stat-item"><div class="stat-label">Total Talent</div><div class="stat-value">${db.length}</div></div>
    <div class="stat-item"><div class="stat-label">Combined Reach</div><div class="stat-value">${fmt(ig+tt+yt)}</div></div>
    <div class="stat-item"><div class="stat-label">Instagram</div><div class="stat-value ig">${fmt(ig)}</div></div>
    <div class="stat-item"><div class="stat-label">TikTok</div><div class="stat-value tt">${fmt(tt)}</div></div>
    <div class="stat-item"><div class="stat-label">YouTube</div><div class="stat-value yt">${fmt(yt)}</div></div>`;
}

function renderGrid(l){
  const mx=Math.max(...db.map(total),1);
  if(!l.length)return '<div class="empty-state">No talent found.</div>';
  return`<div class="grid-container">${l.map(t=>{
    const T=total(t),ti=tier(T),idx=db.indexOf(t);
    return`<div class="talent-card" onclick="openProfile(${idx})">
      <div class="card-header">${avHtml(t)}<div>
        <div class="card-name">${t.name}</div>
        <div class="card-meta">${fmtCountry(t.country||'')}</div>
      </div></div>
      <div class="tier-badge tier-${ti}">${ti}</div>
      <div class="card-stats">
        <div class="stat-row"><span class="stat-platform"><span class="plat-dot ig"></span>Instagram</span><div class="stat-bar-wrap"><div class="stat-bar-fill ig" style="width:${Math.round(((t.instagram_followers||0)/mx)*100)}%"></div></div><span class="stat-num">${fmt(t.instagram_followers)||'—'}</span></div>
        <div class="stat-row"><span class="stat-platform"><span class="plat-dot tt"></span>TikTok</span><div class="stat-bar-wrap"><div class="stat-bar-fill tt" style="width:${Math.round(((t.tiktok_followers||0)/mx)*100)}%"></div></div><span class="stat-num">${fmt(t.tiktok_followers)||'—'}</span></div>
        <div class="stat-row"><span class="stat-platform"><span class="plat-dot yt"></span>YouTube</span><div class="stat-bar-wrap"><div class="stat-bar-fill yt" style="width:${Math.round(((t.youtube_followers||0)/mx)*100)}%"></div></div><span class="stat-num">${fmt(t.youtube_followers)||'—'}</span></div>
      </div>
      <div class="card-total"><span class="total-label">Total Reach</span><span class="total-num">${fmt(T)||'—'}</span></div>
    </div>`;
  }).join('')}</div>`;
}

function renderList(l){
  if(!l.length)return '<div class="empty-state">No talent found.</div>';
  return`<div class="list-container"><table class="list-table">
    <thead><tr><th>#</th><th>Name</th><th>Role</th><th>Country</th><th>Tier</th>
    <th style="color:var(--ig)">Instagram</th><th style="color:var(--tt)">TikTok</th>
    <th style="color:var(--yt)">YouTube</th><th style="color:var(--gold)">Total</th></tr></thead>
    <tbody>${l.map((t,i)=>{
      const T=total(t),ti=tier(T),idx=db.indexOf(t);
      return`<tr onclick="openProfile(${idx})">
        <td style="color:var(--muted2);font-size:11px">${i+1}</td>
        <td><div class="td-name">${avHtml(t,'sm')} ${t.name}</div></td>
        <td class="td-role">${t.role||''}</td>
        <td class="td-country">${fmtCountry(t.country||'')}</td>
        <td><span class="tier-badge tier-${ti}" style="font-size:8px">${ti}</span></td>
        <td class="${(t.instagram_followers||0)?'td-num':'td-zero'}">${fmt(t.instagram_followers)||'—'}</td>
        <td class="${(t.tiktok_followers||0)?'td-num':'td-zero'}">${fmt(t.tiktok_followers)||'—'}</td>
        <td class="${(t.youtube_followers||0)?'td-num':'td-zero'}">${fmt(t.youtube_followers)||'—'}</td>
        <td class="td-num total">${fmt(T)||'—'}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}

function renderAll(){
  const l=filtered();
  document.getElementById('resultsCount').textContent=l.length+' of '+db.length+' talent';
  document.getElementById('mainContent').innerHTML=view==='grid'?renderGrid(l):renderList(l);
}
function setView(v){view=v;document.getElementById('btnGrid').classList.toggle('active',v==='grid');document.getElementById('btnList').classList.toggle('active',v==='list');renderAll();}

// ===================== EDIT MODAL =====================
function openEdit(idx){
  editIdx=idx;const t=db[idx];
  document.getElementById('modalTitle').textContent=t.name;
  document.getElementById('modalSub').textContent='@'+(t.instagram||'')+' · '+fmtCountry(t.country||'');
  document.getElementById('modalTier').innerHTML=`<span class="tier-badge tier-${tier(total(t))}">${tier(total(t))}</span>`;
  document.getElementById('modalAvatar').innerHTML=t.photo_url?`<img src="${t.photo_url}" onerror="this.parentNode.innerHTML='${initials(t.name)}'">`  :initials(t.name);
  document.getElementById('editName').value=t.name||'';
  document.getElementById('editRole').value=t.role||'';
  document.getElementById('editCountry').value=t.country||'';
  document.getElementById('editInstagram').value='@'+(t.instagram||'');
  document.getElementById('editTiktok').value=t.tiktok_handle||'';
  document.getElementById('editYoutube').value=t.youtube_handle||'';
  document.getElementById('editPhotoUrl').value=t.photo_url||'';
  document.getElementById('editBio').value=t.bio||'';
  document.getElementById('editIg').value=t.instagram_followers||'';
  document.getElementById('editTt').value=t.tiktok_followers||'';
  document.getElementById('editYt').value=t.youtube_followers||'';
  document.getElementById('editNotes').value=t.notes||'';
  document.getElementById('deleteBtn').style.display='';
  document.getElementById('modalOverlay').classList.add('open');
}

function openAddModal(){
  editIdx=-1;
  ['editName','editRole','editCountry','editInstagram','editTiktok','editYoutube','editPhotoUrl','editBio','editNotes','editIg','editTt','editYt'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('modalTitle').textContent='New Talent';
  document.getElementById('modalSub').textContent='';
  document.getElementById('modalTier').innerHTML='';
  document.getElementById('modalAvatar').innerHTML='+';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('modalOverlay').classList.add('open');
}

function previewPhoto(){
  const url=document.getElementById('editPhotoUrl').value;
  const name=document.getElementById('editName').value;
  document.getElementById('modalAvatar').innerHTML=url?`<img src="${url}" onerror="this.parentNode.innerHTML='?'">` :(name?initials(name):'?');
}

async function saveTalent(){
  const name=document.getElementById('editName').value.trim();
  if(!name){showToast('Name is required');return;}
  const rec={
    id:editIdx>=0?db[editIdx].id:Date.now(),
    name,
    role:document.getElementById('editRole').value.trim(),
    country:document.getElementById('editCountry').value.trim(),
    instagram:document.getElementById('editInstagram').value.replace('@','').trim(),
    tiktok_handle:document.getElementById('editTiktok').value.replace('@','').trim(),
    youtube_handle:document.getElementById('editYoutube').value.trim(),
    instagram_followers:parseInt(document.getElementById('editIg').value)||0,
    tiktok_followers:parseInt(document.getElementById('editTt').value)||0,
    youtube_followers:parseInt(document.getElementById('editYt').value)||0,
    photo_url:document.getElementById('editPhotoUrl').value.trim(),
    bio:document.getElementById('editBio').value.trim(),
    notes:document.getElementById('editNotes').value.trim(),
    last_updated:new Date().toISOString().split('T')[0],
    gender:editIdx>=0?(db[editIdx].gender||''):''
  };
  if(editIdx>=0){db[editIdx]=rec;}else{db.push(rec);}
  saveLocal();closeModalDirect();renderStats();renderAll();
  showToast(editIdx>=0?'Saved & syncing…':'Added & syncing…');
  setSyncUI('busy','Saving to Sheets…');
  pushRecord(rec);
}

async function deleteTalent(){
  if(editIdx<0)return;
  if(!confirm('Remove '+db[editIdx].name+' from database?'))return;
  const id=db[editIdx].id;
  db.splice(editIdx,1);
  saveLocal();closeModalDirect();renderStats();renderAll();
  showToast('Removed');setSyncUI('busy','Syncing…');
  deleteRecord(id);
}

function closeModalDirect(){document.getElementById('modalOverlay').classList.remove('open');}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

function exportCSV(){
  const h=['Name','Role','Gender','Country','Instagram','TikTok Handle','YouTube Handle','IG Followers','TT Followers','YT Followers','Total Reach','Tier','Bio','Notes','Last Updated'];
  const rows=db.map(t=>[t.name,t.role||'',t.gender||'',t.country||'','@'+(t.instagram||''),t.tiktok_handle||'',t.youtube_handle||'',t.instagram_followers||0,t.tiktok_followers||0,t.youtube_followers||0,total(t),tier(total(t)),t.bio||'',t.notes||'',t.last_updated||'']);
  const csv=[h,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='atoure-talent-'+new Date().toISOString().split('T')[0]+'.csv';a.click();
  showToast('CSV exported');
}

loadLocal();renderStats();renderAll();pullFromSheets();
</script>
